name: Keep app awake

# Streamlit Community Cloud puts free apps to sleep when nobody visits them for a while.
# A plain HTTP request does not wake a sleeping app, so this opens the page in a real
# browser every 6 hours and clicks the wake-up button if it is shown.
# Up to 3 attempts per run; the run fails only if all attempts fail.

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-24.04      # pinned: ubuntu-latest moved to Ubuntu 26 on 2026-10-19
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Open the app and wake it if asleep
        env:
          APP_URL: https://chainproof-steel.streamlit.app/
        run: |
          python - <<'PY'
          import os, sys, time
          from playwright.sync_api import sync_playwright

          URL = os.environ["APP_URL"]
          MARKERS = ("今日预警", "企业档案", "ChainProof", "链证")

          def app_is_up(page, seconds):
              end = time.time() + seconds
              while time.time() < end:
                  for frame in page.frames:
                      try:
                          text = frame.inner_text("body", timeout=2_000)
                      except Exception:
                          continue
                      if any(m in text for m in MARKERS):
                          return True
                  page.wait_for_timeout(5_000)
              return False

          def attempt(p, n):
              browser = p.chromium.launch()
              page = browser.new_page()
              try:
                  page.goto(URL, wait_until="domcontentloaded", timeout=120_000)
                  page.wait_for_timeout(8_000)
                  button = page.get_by_role("button", name="get this app back up", exact=False)
                  if button.count():
                      print(f"[{n}] app was asleep - clicking the wake-up button")
                      button.first.click()
                      ok = app_is_up(page, 240)
                  else:
                      print(f"[{n}] no wake-up button - waiting for the app")
                      ok = app_is_up(page, 150)
                  if not ok:
                      page.screenshot(path=f"attempt{n}.png", full_page=True)
                  return ok
              except Exception as e:
                  print(f"[{n}] error: {e}")
                  return False
              finally:
                  browser.close()

          with sync_playwright() as p:
              for n in (1, 2, 3):
                  if attempt(p, n):
                      print("App is up")
                      sys.exit(0)
                  time.sleep(30)
          print("App did not show its home page after 3 attempts")
          sys.exit(1)
          PY
      - name: Save screenshots if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-screenshots
          path: attempt*.png
          if-no-files-found: ignore
